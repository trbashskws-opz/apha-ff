name: Build Alpha FF dylib

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug — show tree
        run: |
          echo "=== workspace files ==="
          ls -la
          echo "=== Makefile ==="
          cat Makefile || true
          echo "=== control ==="
          cat control || true
          echo "=== Tweak.xm (head) ==="
          head -20 Tweak.xm || true

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          mkdir -p $THEOS
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install toolchain
        run: |
          echo "THEOS=$THEOS"
          ls -la $THEOS/bin/ | head -20

      - name: Build package
        env:
          THEOS: ${{ env.THEOS }}
        run: |
          set -o pipefail    # ← مهم جدًا — ينقل exit code الفعلي
          make clean 2>&1 || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless V=1 2>&1 | tee /tmp/build.log
          # لا نستخدم || true هنا

      - name: Show tail of log on failure
        if: failure()
        run: |
          echo "=== LAST 100 LINES OF BUILD LOG ==="
          tail -100 /tmp/build.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
