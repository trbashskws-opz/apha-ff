name: Build Alpha FF dylib

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug — show tree
        run: |
          echo "=== files in workspace ==="
          ls -la
          echo "=== Makefile ==="
          cat Makefile || echo "NO MAKEFILE"
          echo "=== control ==="
          cat control || echo "NO CONTROL"

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          mkdir -p $THEOS
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install toolchain
        run: |
          echo "THEOS=$THEOS"
          ls -la $THEOS/bin/ | head
          $THEOS/bin/nic.pl --version || true

      - name: Build package
        env:
          THEOS: ${{ env.THEOS }}
        run: |
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless V=1 2>&1 | tee /tmp/build.log
          echo "exit code: $?"

      - name: Show tail of log on failure
        if: failure()
        run: |
          echo "=== LAST 80 LINES OF BUILD LOG ==="
          tail -80 /tmp/build.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
